name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          cordova create build_app com.alipardahouse.app "Alipardahouse"
          rm -rf build_app/www/*

          cp -r \
            index.html \
            "Al-Amin.html" \
            "Al-Gafoor.html" \
            "Barfi.html" \
            "BLINDS.html" \
            "Brackets.html" \
            "CNC.html" \
            "completed_work.html" \
            "Curtain Rings.html" \
            "double ring.html" \
            "drive.html" \
            "Faisalabad-Texture.html" \
            "Fancy_Designs.html" \
            "Jali_Designs.html" \
            "Jahlar_Designs.html" \
            "Majlis.html" \
            "Pathan-Texture.html" \
            "PERSONAL DATA.html" \
            "Pipes.html" \
            "Plain Curtains.html" \
            "Plain-Malai.html" \
            "prompts.html" \
            "Roller Blinds.html" \
            "SOFA.html" \
            "Stopers.html" \
            "Texture Curtains.html" \
            "TIE HUKS.html" \
            "Vertical Blinds.html" \
            "Wooden Blinds.html" \
            "Wooden_Box.html" \
            "Zebra Blinds.html" \
            build_app/www/

          cp config.xml build_app/

          mkdir -p build_app/images

          cp images/icon.png build_app/images/
          cp images/splash.png build_app/images/

          cd build_app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
