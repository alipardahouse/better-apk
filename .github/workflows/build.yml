name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Cordova Project
        run: |
          # Create the Cordova project workspace
          cordova create build_app com.alipardahouse.app "Alipardahouse"

          # Clear out default placeholder files
          rm -rf build_app/www/*

          # Copy ALL repository files and folders into build_app/www/ 
          # excluding the build_app directory itself, git metadata, and workflow files
          rsync -av --progress ./ build_app/www/ \
            --exclude 'build_app' \
            --exclude '.git' \
            --exclude '.github'

          # If you have a custom config.xml in your root, copy it to the app root
          if [ -f "config.xml" ]; then
            cp config.xml build_app/
          fi

          cd build_app

          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: build_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk