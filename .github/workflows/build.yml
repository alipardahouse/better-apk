
      - name: Build Cordova Project
        run: |
          cordova create build_app com.alipardahouse.app "Alipardahouse"

          rm -rf build_app/www/*

          # Copy ALL existing HTML files automatically
          cp -r *.html build_app/www/

          # Copy ALL existing images into APK
          cp -r images build_app/www/

          # Clone existing Cuttlefish repository
          git clone https://github.com/cottonrays/cuttlefish.git build_app/www/cuttlefish

          # REMOVE the .git folder
          rm -rf build_app/www/cuttlefish/.git

          # Clone Stock Cutter repository into the APK
          git clone https://github.com/kamsec/stock-cutter.git build_app/www/stock-cutter

          # REMOVE the .git folder
          rm -rf build_app/www/stock-cutter/.git

          # Copy config file
          cp config.xml build_app/

          # Create images folder for app icons
          mkdir -p build_app/images

          # Copy app icons
          cp images/icon.png build_app/images/
          cp images/splash.png build_app/images/

          cd build_app

          cordova platform add android

          cordova build android --debug
